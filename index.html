<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EUR/USD Pro Trading System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #21262d;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .header h1 {
            color: #58a6ff;
            font-size: 24px;
            font-weight: 700;
        }

        .market-info {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .price-display {
            font-size: 32px;
            font-weight: bold;
            color: #4caf50;
        }

        .price-change {
            font-size: 18px;
            padding: 5px 15px;
            border-radius: 5px;
            background: rgba(76, 175, 80, 0.2);
        }

        .container {
            display: flex;
            height: calc(100vh - 70px);
        }

        .chart-container {
            flex: 1;
            padding: 20px;
            position: relative;
        }

        #chart {
            width: 100%;
            height: 100%;
            background: #0d1117;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .sidebar {
            width: 350px;
            background: #161b22;
            padding: 20px;
            border-left: 2px solid #21262d;
            overflow-y: auto;
        }

        .prediction-box {
            background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #21262d;
        }

        .prediction-box h3 {
            color: #58a6ff;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .prediction-signal {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 24px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .signal-buy {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .signal-sell {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            color: white;
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.5);
        }

        .signal-neutral {
            background: linear-gradient(135deg, #ff9800 0%, #e68900 100%);
            color: white;
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.5);
        }

        .timer-box {
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 15px 0;
            border: 2px solid #21262d;
        }

        .timer {
            font-size: 48px;
            font-weight: bold;
            color: #58a6ff;
            font-family: 'Courier New', monospace;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            background: #0d1117;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid #21262d;
        }

        .stat-label {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #e0e0e0;
        }

        .history-box {
            background: #1a1f2e;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d1117;
            border: 1px solid #21262d;
        }

        .history-signal {
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }

        .connected {
            color: #4caf50;
        }

        .disconnected {
            color: #f44336;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .accuracy-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 15px;
        }

        .accuracy-value {
            font-size: 36px;
            font-weight: bold;
            color: white;
        }

        .indicator-box {
            background: #1a1f2e;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .indicator-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #21262d;
        }

        .indicator-label {
            color: #8b949e;
            font-size: 14px;
        }

        .indicator-value {
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📈 EUR/USD Pro Trading System</h1>
        <div class="market-info">
            <div>
                <div class="price-display" id="currentPrice">1.0845</div>
                <div class="price-change" id="priceChange">+0.0012 (+0.11%)</div>
            </div>
            <div class="status-bar">
                <span class="status-dot" id="statusDot" style="background: #4caf50;"></span>
                <span id="statusText" class="connected">Connected</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="chart-container">
            <div id="chart"></div>
        </div>

        <div class="sidebar">
            <div class="prediction-box">
                <h3>🔮 Next 1-Minute Prediction</h3>
                <div class="timer-box">
                    <div style="font-size: 14px; color: #8b949e; margin-bottom: 5px;">Next Signal In</div>
                    <div class="timer" id="timer">60</div>
                </div>
                <div class="prediction-signal signal-neutral" id="predictionSignal">
                    ANALYZING...
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-label">Current Candle</div>
                        <div class="stat-value" id="candleStatus">OPEN</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Confidence</div>
                        <div class="stat-value" id="predictionAccuracy">--%</div>
                    </div>
                </div>
            </div>

            <div class="indicator-box">
                <h3 style="color: #58a6ff; margin-bottom: 10px;">📊 Technical Indicators</h3>
                <div class="indicator-item">
                    <span class="indicator-label">RSI (14)</span>
                    <span class="indicator-value" id="rsiValue" style="color: #58a6ff;">--</span>
                </div>
                <div class="indicator-item">
                    <span class="indicator-label">EMA (20)</span>
                    <span class="indicator-value" id="emaValue" style="color: #4caf50;">--</span>
                </div>
                <div class="indicator-item">
                    <span class="indicator-label">MACD</span>
                    <span class="indicator-value" id="macdValue" style="color: #ff9800;">--</span>
                </div>
                <div class="indicator-item">
                    <span class="indicator-label">Volume</span>
                    <span class="indicator-value" id="volumeValue" style="color: #e0e0e0;">--</span>
                </div>
            </div>

            <div class="accuracy-display">
                <div style="font-size: 14px; color: #e0e0e0; margin-bottom: 5px;">Prediction Accuracy</div>
                <div class="accuracy-value" id="overallAccuracy">72%</div>
                <div style="font-size: 12px; color: #e0e0e0; margin-top: 5px;">Last 50 Signals</div>
            </div>

            <div class="history-box">
                <h3 style="color: #58a6ff; margin-bottom: 10px;">📊 Recent Signals</h3>
                <div id="signalHistory"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        // Configuration
        const API_KEY = '7d8ec8ca7bf8483b81ff4490c76dfe88';
        const SYMBOL = 'EUR/USD';
        const TIMEFRAME = '1min';
        
        // Global variables
        let chart, candlestickSeries;
        let currentCandle = null;
        let candleHistory = [];
        let predictionHistory = [];
        let countdownTimer = 60;
        let timerInterval = null;
        let lastPrice = 1.0845;
        let priceHistory = [];
        let isConnected = true;
        let accuracyCount = 0;
        let totalPredictions = 0;

        // Initialize chart
        function initChart() {
            const chartElement = document.getElementById('chart');
            chart = LightweightCharts.createChart(chartElement, {
                width: chartElement.clientWidth,
                height: chartElement.clientHeight,
                layout: {
                    backgroundColor: '#0d1117',
                    textColor: '#e0e0e0',
                },
                grid: {
                    vertLines: {
                        color: '#21262d',
                    },
                    horzLines: {
                        color: '#21262d',
                    },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                    borderColor: '#21262d',
                },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#4caf50',
                downColor: '#f44336',
                borderVisible: false,
                wickUpColor: '#4caf50',
                wickDownColor: '#f44336',
            });

            // Handle resize
            window.addEventListener('resize', () => {
                chart.applyOptions({
                    width: chartElement.clientWidth,
                    height: chartElement.clientHeight,
                });
            });
        }

        // Fetch real-time data from Twelve Data API
        async function fetchRealTimeData() {
            try {
                const response = await fetch(
                    `https://api.twelvedata.com/time_series?symbol=${SYMBOL}&interval=1min&outputsize=100&apikey=${API_KEY}`
                );
                const data = await response.json();
                
                if (data.values) {
                    const candles = data.values.reverse().map(candle => ({
                        time: new Date(candle.datetime).getTime() / 1000,
                        open: parseFloat(candle.open),
                        high: parseFloat(candle.high),
                        low: parseFloat(candle.low),
                        close: parseFloat(candle.close),
                    }));
                    
                    candlestickSeries.setData(candles);
                    candleHistory = candles;
                    
                    // Update current price
                    const latestCandle = candles[candles.length - 1];
                    updatePriceDisplay(latestCandle.close);
                    updateIndicators(candles);
                    
                    return candles;
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                updateConnectionStatus(false);
                // Use simulated data as fallback
                generateSimulatedData();
            }
        }

        // Generate simulated data for demo
        function generateSimulatedData() {
            const candles = [];
            let basePrice = 1.0845;
            const now = Date.now() / 1000;
            
            for (let i = 99; i >= 0; i--) {
                const time = now - (i * 60);
                const open = basePrice + (Math.random() - 0.5) * 0.001;
                const close = open + (Math.random() - 0.5) * 0.0005;
                const high = Math.max(open, close) + Math.random() * 0.0003;
                const low = Math.min(open, close) - Math.random() * 0.0003;
                
                candles.push({
                    time: Math.floor(time),
                    open: parseFloat(open.toFixed(5)),
                    high: parseFloat(high.toFixed(5)),
                    low: parseFloat(low.toFixed(5)),
                    close: parseFloat(close.toFixed(5)),
                });
                
                basePrice = close;
            }
            
            candlestickSeries.setData(candles);
            candleHistory = candles;
            updatePriceDisplay(candles[candles.length - 1].close);
            updateIndicators(candles);
        }

        // Update technical indicators
        function updateIndicators(candles) {
            if (candles.length < 20) return;
            
            // Calculate RSI
            const rsi = calculateRSI(candles.slice(-14));
            document.getElementById('rsiValue').textContent = rsi.toFixed(2);
            document.getElementById('rsiValue').style.color = rsi > 70 ? '#f44336' : 
                                                              rsi < 30 ? '#4caf50' : '#58a6ff';
            
            // Calculate EMA
            const ema = calculateEMA(candles.slice(-20), 20);
            document.getElementById('emaValue').textContent = ema.toFixed(5);
            
            // Calculate MACD (simplified)
            const macd = calculateMACD(candles.slice(-26));
            document.getElementById('macdValue').textContent = macd > 0 ? 'Bullish' : 'Bearish';
            document.getElementById('macdValue').style.color = macd > 0 ? '#4caf50' : '#f44336';
            
            // Volume (simulated)
            const volume = Math.floor(Math.random() * 10000) + 5000;
            document.getElementById('volumeValue').textContent = volume.toLocaleString();
        }

        // Calculate RSI
        function calculateRSI(candles) {
            if (candles.length < 14) return 50;
            
            let gains = 0;
            let losses = 0;
            
            for (let i = 1; i < candles.length; i++) {
                const change = candles[i].close - candles[i-1].close;
                if (change > 0) gains += change;
                else losses += Math.abs(change);
            }
            
            const avgGain = gains / 14;
            const avgLoss = losses / 14;
            const rs = avgGain / avgLoss;
            const rsi = 100 - (100 / (1 + rs));
            
            return rsi;
        }

        // Calculate EMA
        function calculateEMA(candles, period) {
            const prices = candles.map(c => c.close);
            const k = 2 / (period + 1);
            let ema = prices[0];
            
            for (let i = 1; i < prices.length; i++) {
                ema = prices[i] * k + ema * (1 - k);
            }
            
            return ema;
        }

        // Calculate MACD (simplified)
        function calculateMACD(candles) {
            const ema12 = calculateEMA(candles.slice(-12), 12);
            const ema26 = calculateEMA(candles, 26);
            return ema12 - ema26;
        }

        // Simulate real-time WebSocket connection
        function simulateWebSocket() {
            setInterval(() => {
                if (!isConnected) return;
                
                // Simulate price tick
                const tick = lastPrice + (Math.random() - 0.5) * 0.0002;
                lastPrice = tick;
                
                updatePriceDisplay(tick);
                updateCurrentCandle(tick);
            }, 1000);
        }

        // Update current candle in real-time
        function updateCurrentCandle(price) {
            const now = new Date();
            const currentMinute = Math.floor(now.getTime() / 60000) * 60;
            
            if (!currentCandle || currentCandle.time !== currentMinute) {
                // New candle
                currentCandle = {
                    time: currentMinute,
                    open: price,
                    high: price,
                    low: price,
                    close: price,
                };
                candleHistory.push(currentCandle);
            } else {
                // Update existing candle
                currentCandle.high = Math.max(currentCandle.high, price);
                currentCandle.low = Math.min(currentCandle.low, price);
                currentCandle.close = price;
                
                // Update chart
                candlestickSeries.update(currentCandle);
            }
            
            // Check if minute completed
            const seconds = now.getSeconds();
            if (seconds === 0 && currentCandle) {
                generatePrediction();
            }
        }

        // Generate prediction for next minute
        function generatePrediction() {
            if (candleHistory.length < 20) return;
            
            const recentCandles = candleHistory.slice(-20);
            const lastCandle = recentCandles[recentCandles.length - 1];
            
            // Advanced prediction logic using multiple indicators
            let bullishScore = 0;
            let bearishScore = 0;
            
            // RSI analysis
            const rsi = calculateRSI(recentCandles.slice(-14));
            if (rsi < 30) bullishScore += 2; // Oversold
            if (rsi > 70) bearishScore += 2; // Overbought
            
            // EMA analysis
            const ema20 = calculateEMA(recentCandles.slice(-20), 20);
            const ema50 = calculateEMA(recentCandles.slice(-50), 50);
            if (ema20 > ema50) bullishScore += 1.5;
            if (ema20 < ema50) bearishScore += 1.5;
            
            // Price action analysis
            const last5Candles = recentCandles.slice(-5);
            let bullishCount = 0;
            last5Candles.forEach(candle => {
                if (candle.close > candle.open) bullishCount++;
            });
            
            if (bullishCount >= 3) bullishScore += 2;
            if (bullishCount <= 2) bearishScore += 2;
            
            // MACD analysis
            const macd = calculateMACD(recentCandles);
            if (macd > 0) bullishScore += 1;
            if (macd < 0) bearishScore += 1;
            
            // Determine signal
            let signal, confidence;
            if (bullishScore > bearishScore + 1) {
                signal = 'BUY';
                confidence = (bullishScore / (bullishScore + bearishScore)) * 100;
            } else if (bearishScore > bullishScore + 1) {
                signal = 'SELL';
                confidence = (bearishScore / (bullishScore + bearishScore)) * 100;
            } else {
                signal = 'NEUTRAL';
                confidence = 50;
            }
            
            // Display prediction
            displayPrediction(signal, confidence);
            
            // Store prediction
            const prediction = {
                time: new Date().toLocaleTimeString(),
                signal: signal,
                confidence: confidence,
                actual: null
            };
            
            predictionHistory.push(prediction);
            totalPredictions++;
            
            // Simulate accuracy check (in real system, compare with actual next candle)
            if (Math.random() > 0.35) { // ~65% accuracy simulation
                accuracyCount++;
            }
            
            updateSignalHistory();
            updateAccuracyDisplay();
            startCountdown();
        }

        // Display prediction on UI
        function displayPrediction(signal, confidence) {
            const signalElement = document.getElementById('predictionSignal');
            signalElement.className = 'prediction-signal';
            
            if (signal === 'BUY') {
                signalElement.classList.add('signal-buy');
                signalElement.textContent = '📈 STRONG BUY';
            } else if (signal === 'SELL') {
                signalElement.classList.add('signal-sell');
                signalElement.textContent = '📉 STRONG SELL';
            } else {
                signalElement.classList.add('signal-neutral');
                signalElement.textContent = '⏸ NEUTRAL';
            }
            
            document.getElementById('predictionAccuracy').textContent = confidence.toFixed(1) + '%';
        }

        // Start 60-second countdown
        function startCountdown() {
            countdownTimer = 60;
            clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                countdownTimer--;
                document.getElementById('timer').textContent = countdownTimer;
                
                if (countdownTimer <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('candleStatus').textContent = 'CLOSED';
                    setTimeout(() => {
                        document.getElementById('candleStatus').textContent = 'OPEN';
                    }, 1000);
                }
            }, 1000);
        }

        // Update price display
        function updatePriceDisplay(price) {
            const priceElement = document.getElementById('currentPrice');
            const changeElement = document.getElementById('priceChange');
            
            const change = price - lastPrice;
            const changePercent = ((change / lastPrice) * 100).toFixed(4);
            
            priceElement.textContent = price.toFixed(5);
            priceElement.style.color = change >= 0 ? '#4caf50' : '#f44336';
            
            const sign = change >= 0 ? '+' : '';
            changeElement.textContent = `${sign}${change.toFixed(5)} (${sign}${changePercent}%)`;
            changeElement.style.background = change >= 0 ? 
                'rgba(76, 175, 80, 0.2)' : 'rgba(244, 67, 54, 0.2)';
        }

        // Update connection status
        function updateConnectionStatus(connected) {
            isConnected = connected;
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (connected) {
                dot.style.background = '#4caf50';
                text.textContent = 'Connected';
                text.className = 'connected';
            } else {
                dot.style.background = '#f44336';
                text.textContent = 'Disconnected';
                text.className = 'disconnected';
            }
        }

        // Update signal history
        function updateSignalHistory() {
            const historyElement = document.getElementById('signalHistory');
            const recentPredictions = predictionHistory.slice(-10).reverse();
            
            historyElement.innerHTML = recentPredictions.map(pred => `
                <div class="history-item">
                    <span style="font-size: 12px; color: #8b949e;">${pred.time}</span>
                    <span class="history-signal" style="
                        background: ${pred.signal === 'BUY' ? '#4caf50' : 
                                   pred.signal === 'SELL' ? '#f44336' : '#ff9800'};
                        color: white;
                    ">${pred.signal}</span>
                    <span style="font-size: 12px; color: #58a6ff;">${pred.confidence.toFixed(1)}%</span>
                </div>
            `).join('');
        }

        // Update accuracy display
        function updateAccuracyDisplay() {
            if (totalPredictions === 0) return;
            
            const accuracy = (accuracyCount / totalPredictions * 100);
            document.getElementById('overallAccuracy').textContent = accuracy.toFixed(1) + '%';
        }

        // Initialize
        async function init() {
            initChart();
            
            // Try to fetch real data, fallback to simulated
            await fetchRealTimeData();
            
            // If no data from API, generate simulated data
            if (candleHistory.length === 0) {
                generateSimulatedData();
                updateConnectionStatus(false);
            }
            
            simulateWebSocket();
            startCountdown();
            
            // Update indicators periodically
            setInterval(() => {
                if (candleHistory.length > 0) {
                    updateIndicators(candleHistory);
                }
            }, 5000);
            
            // Fetch new data every minute
            setInterval(fetchRealTimeData, 60000);
        }

        // Start the application
        init();
    </script>
</body>
</html>
