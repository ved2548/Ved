<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twelve Data API Monitor</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,sans-serif;
}

body{
background:#050b16;
color:#fff;
overflow-x:hidden;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
flex-wrap:wrap;
gap:10px;
}

.title{
font-size:28px;
font-weight:700;
}

.refresh{
font-size:14px;
color:#9aa4b2;
}

/* Slider Container */
.slider-container{
width:100%;
overflow-x:auto;
scroll-snap-type:x mandatory;
display:flex;
scroll-behavior:smooth;
}

.slider-container::-webkit-scrollbar{
display:none;
}

.slide{
min-width:100%;
scroll-snap-align:start;
padding:0 20px 20px;
}

/* Summary Cards */
.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:15px;
margin-bottom:25px;
}

.summary-card{
background:linear-gradient(145deg,#081420,#0d1f2f);
padding:18px;
border-radius:18px;
border:1px solid rgba(255,255,255,.08);
}

.summary-card h3{
font-size:13px;
color:#8f9bab;
margin-bottom:10px;
letter-spacing:1px;
}

.summary-card span{
font-size:28px;
font-weight:700;
color:#00ffb3;
}

/* API Cards Grid */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.card{
background:linear-gradient(145deg,#081420,#0d1f2f);
border-radius:24px;
padding:30px 25px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 20px rgba(0,255,180,.08);
text-align:center;
}

.resource-label{
font-size:12px;
letter-spacing:2px;
color:#9aa4b2;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
margin-bottom:10px;
}

.resource-name{
font-size:26px;
font-weight:800;
word-break:break-word;
margin-bottom:20px;
}

.status-circle{
width:90px;
height:90px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
margin:0 auto 15px;
font-weight:bold;
}

.operational{
background:#00d084;
box-shadow:0 0 30px #00d084;
}

.invalid{
background:#ff4d4d;
box-shadow:0 0 30px #ff4d4d;
}

.error{
background:#ff9800;
box-shadow:0 0 30px #ff9800;
}

.state-label{
font-size:12px;
letter-spacing:2px;
color:#9aa4b2;
margin-bottom:5px;
}

.state{
font-size:32px;
font-weight:800;
margin-bottom:25px;
}

.divider{
height:1px;
background:rgba(255,255,255,.1);
margin:20px 0;
}

.info-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.info-label{
font-size:12px;
letter-spacing:1px;
color:#9aa4b2;
}

.info-value{
font-size:28px;
font-weight:700;
}

.uptime{
color:#00ffb3;
}

.email-small{
font-size:13px;
color:#8f9bab;
margin-top:15px;
word-break:break-word;
}

/* Website Slide */
.website-iframe{
width:100%;
height:70vh;
border:none;
border-radius:24px;
background:#0d1f2f;
}

.slide-indicator{
display:flex;
justify-content:center;
gap:10px;
margin:15px 0;
}

.dot{
width:10px;
height:10px;
border-radius:50%;
background:rgba(255,255,255,.2);
transition:0.3s;
}

.dot.active{
background:#00ffb3;
box-shadow:0 0 10px #00ffb3;
}

.slide-hint{
text-align:center;
color:#9aa4b2;
font-size:13px;
margin-bottom:10px;
}
</style>
</head>
<body>

<div class="header">
<div class="title">MONITOR DASHBOARD</div>
<div class="refresh" id="lastRefresh">Last Refresh: --</div>
</div>

<div class="slide-hint">← Right to left swipe karo →</div>

<div class="slide-indicator">
<div class="dot active" id="dot1"></div>
<div class="dot" id="dot2"></div>
</div>

<div class="slider-container" id="slider">

<!-- SLIDE 1: API Keys Status -->
<div class="slide">
<div class="summary">
<div class="summary-card">
<h3>TOTAL ACCOUNTS</h3>
<span id="totalAccounts">9</span>
</div>
<div class="summary-card">
<h3>ACTIVE</h3>
<span id="activeCount">0</span>
</div>
<div class="summary-card">
<h3>INVALID</h3>
<span id="invalidCount">0</span>
</div>
<div class="summary-card">
<h3>NEXT CHECK</h3>
<span id="globalCountdown">30s</span>
</div>
</div>
<div class="grid" id="cards"></div>
</div>

<!-- SLIDE 2: Website Status -->
<div class="slide">
<div class="summary">
<div class="summary-card" style="grid-column:1/-1;">
<h3>MONITORED WEBSITE</h3>
<span style="font-size:20px;">ved2548.github.io</span>
</div>
</div>
<iframe src="https://ved2548-github-io-oxxrj.isitup.cloud/" class="website-iframe" id="websiteFrame"></iframe>
</div>

</div>

<script>
// =======================
// ACCOUNTS DATA
// =======================
const accounts = [
{name:"Account 1", email:"jayvedprakash2@gmail.com", apiKey:"7d8ec8ca7bf8483b81ff4490c76dfe88"},
{name:"Account 2", email:"h7862937@gmail.com", apiKey:"246618a38ee84e1abdb9511a378c46d4"},
{name:"Account 3", email:"saumi8261@gmail.com", apiKey:"33073d9ef38b4f25860738b1a1eae5bf"},
{name:"Account 4", email:"ythi9211@gmail.com", apiKey:"fbecb3e6b46845deb7fab1f5e728ccc7"},
{name:"Account 5", email:"saumijay361@gmail.com", apiKey:"8120e5ab512040cba8a775b8e1c14434"},
{name:"Account 6", email:"gg1949577@gmail.com", apiKey:"efc7db6d64cb4e4ab6ae9d1095960980"},
{name:"Account 7", email:"saumichoudhary81@gmail.com", apiKey:"04763c31155d46fb867d97e0141557ca"},
{name:"Account 8", email:"vedsaumi@gmail.com", apiKey:"bc0bc3890bc1496a8a3fa23ce1cb8c1e"},
{name:"Account 9", email:"shree98689@gmail.com", apiKey:"c0abbc33813e4b4fbf1254a0a3650db2"}
];

let countdown = 30;
const slider = document.getElementById('slider');
const dot1 = document.getElementById('dot1');
const dot2 = document.getElementById('dot2');

// =======================
// SLIDER INDICATOR
// =======================
slider.addEventListener('scroll',()=>{
const slideIndex = Math.round(slider.scrollLeft / window.innerWidth);
if(slideIndex === 0){
dot1.classList.add('active');
dot2.classList.remove('active');
}else{
dot1.classList.remove('active');
dot2.classList.add('active');
}
});

// =======================
// CHECK API KEY
// =======================
async function checkKey(account){
try{
const url = `https://api.twelvedata.com/time_series?symbol=AAPL&interval=1day&apikey=${account.apiKey}`;
const response = await fetch(url);
const data = await response.json();

if(data.code){
return {...account, status:"INVALID", icon:"!", className:"invalid", uptime:"0.00%"};
}
return {...account, status:"OPERATIONAL", icon:"✓", className:"operational", uptime:"100.00%"};
}catch(error){
return {...account, status:"ERROR", icon:"⚠", className:"error", uptime:"0.00%"};
}
}

// =======================
// LOAD API DASHBOARD
// =======================
async function loadDashboard(){
let active = 0;
let invalid = 0;
const container = document.getElementById("cards");
container.innerHTML = "";

for(const account of accounts){
const result = await checkKey(account);
if(result.status === "OPERATIONAL"){ active++; } else { invalid++; }

container.innerHTML += `
<div class="card">
<div class="resource-label">
<svg width="14" height="14" fill="#9aa4b2" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
MONITORED RESOURCE
</div>
<div class="resource-name">${result.name}</div>
<div class="status-circle ${result.className}">${result.icon}</div>
<div class="state-label">CURRENT STATE</div>
<div class="state">${result.status}</div>
<div class="divider"></div>
<div class="info-row">
<div class="info-label">ACTIVE INCIDENTS</div>
<div class="info-value">${result.status === "OPERATIONAL" ? "0" : "1"}</div>
</div>
<div class="info-row">
<div class="info-label">UPTIME SCORE</div>
<div class="info-value uptime">${result.uptime}</div>
</div>
<div class="email-small">${result.email}</div>
</div>
`;
}

document.getElementById("activeCount").textContent = active;
document.getElementById("invalidCount").textContent = invalid;
document.getElementById("lastRefresh").textContent = "Last Refresh: " + new Date().toLocaleTimeString();
countdown = 30;
}

// =======================
// REFRESH WEBSITE FRAME
// =======================
function refreshWebsite(){
document.getElementById("websiteFrame").src = 
"https://ved2548-github-io-oxxrj.isitup.cloud/?t=" + new Date().getTime();
}

// =======================
// START
// =======================
loadDashboard();
refreshWebsite();

// API Keys: Every 30 seconds
setInterval(loadDashboard, 30000);

// Website: Every 3 minutes = 180000ms
setInterval(refreshWebsite, 180000);

// Countdown Timer
setInterval(()=>{
countdown--;
if(countdown < 0){ countdown = 30; }
document.getElementById("globalCountdown").textContent = countdown + "s";
},1000);
</script>

</body>
</html>
