<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VED – Fresh Water Engine (Live)</title>

<style>
:root{
  --yellow:#f5b301;
  --green:#22c55e;
  --red:#ef4444;
  --text:#eaf6ff;
}
body{
  margin:0;
  font-family:system-ui;
  color:var(--text);
  background:
    radial-gradient(circle at top, rgba(255,255,255,0.15), transparent 40%),
    linear-gradient(180deg,#0ea5e9 0%, #0369a1 40%, #020617 100%);
  min-height:100vh;
}
header{
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  font-weight:900;
}
.clock{color:#7dd3fc;font-size:18px}
.wrap{padding:20px}
.grid{
  display:grid;
  grid-template-columns:1.4fr 1.8fr 1.8fr;
  gap:20px;
}
.card{
  border:1px solid rgba(255,255,255,0.25);
  border-radius:22px;
  padding:22px;
  backdrop-filter:blur(6px);
}
.brand{
  background:linear-gradient(160deg,#facc15,#f59e0b);
  color:#020617;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  font-weight:900;
}
.circle{
  --deg:0deg;
  width:140px;height:140px;
  border-radius:50%;
  background:
    conic-gradient(var(--yellow) var(--deg),rgba(255,255,255,.2) 0);
  display:flex;align-items:center;justify-content:center;margin:auto;
}
.circle span{
  width:96px;height:96px;border-radius:50%;
  background:#020617;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;
}
.barWrap{height:18px;border-radius:12px;background:rgba(255,255,255,.25)}
.bar{height:100%;width:0%;background:var(--green);border-radius:12px;transition:width .4s}
.signalBox{text-align:center}
.timer{font-size:56px;font-weight:900;color:#7dd3fc}
.signal{font-size:52px;font-weight:900}
.big{color:var(--green)}
.small{color:var(--red)}
.skip{color:#fde047}
.phase{font-size:20px;font-weight:900;letter-spacing:1px}
.watching{color:#7dd3fc}
.locking{color:#fde047}
.filter{
  position:absolute;top:16px;right:16px;
  padding:8px 16px;border-radius:14px;
  font-size:13px;font-weight:900;
}
.safe{background:#22c55e;color:#020617}
.biasBig{font-size:48px;font-weight:900;text-align:center}
.bottom{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:20px;margin-top:20px;
}
.priceBig{font-size:34px;font-weight:900}
</style>
</head>

<body>

<header>
  <div class="clock" id="clock">IST --:--:--</div>
  <div id="date">-- --- ----</div>
</header>

<div class="wrap">
<div class="grid">

  <div class="card brand">VED</div>

  <div class="card">
    <h3>Confidence</h3>
    <div class="circle" id="accCircle"><span id="accVal">--%</span></div>
  </div>

  <div class="card">
    <h3>Signal Confidence</h3>
    <div style="font-size:46px;font-weight:900" id="confText">--%</div>
    <div class="barWrap"><div class="bar" id="confBar"></div></div>
  </div>

  <div class="card" style="grid-column:1/-1">
    <h3>Live Price Flow (EUR/USD)</h3>
    <div class="trendWrap" style="height:160px;overflow:hidden">
      <svg viewBox="0 0 300 120" style="width:100%;height:100%">
        <path id="priceLine" style="fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round"/>
      </svg>
    </div>
  </div>

  <div class="card signalBox" style="grid-column:1/-1;position:relative">
    <div class="filter safe" id="apiFilter">CONNECTING…</div>
    <h3>1 Minute Signal</h3>
    <div class="timer" id="timer">60</div>
    <div class="phase watching" id="phase">WATCHING MARKET</div>
    <div class="signal skip" id="signal">WAIT</div>
    <div style="opacity:.7">Watch first 40s · Final signal in last 20s</div>
  </div>

</div>

<div class="bottom">
  <div class="card">
    <h3>API Health</h3>
    <div id="apiHealth" style="font-size:30px;font-weight:900">WAIT</div>
  </div>

  <div class="card">
    <h3>Market Bias (Live)</h3>
    <div id="biasText" class="biasBig">--</div>
    <div class="barWrap"><div class="bar" id="biasBar"></div></div>
  </div>

  <div class="card">
    <h3>Live Price</h3>
    <div class="priceBig" id="livePrice">--</div>
    <div style="opacity:.7" id="priceTime">--:--:--</div>
  </div>
</div>
</div>

<script>
/* ================= CONFIG ================= */
const TWELVE_KEY = "7d8ec8ca7bf8483b81ff4490c76dfe88";
const SYMBOL     = "EUR/USD";
const CYCLE      = 60;   // seconds (1 minute)
const WATCH      = 40;   // watch first 40s
// last 20s (40 -> 60) = final signal + auto momentum capture

/* ================= CLOCK ================= */
setInterval(()=>{
  const d=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Kolkata"}));
  clock.textContent="IST "+d.toTimeString().slice(0,8);
  date.textContent=d.toDateString();
},1000);

/* ================= LIVE STATE ================= */
let ws=null;
let cyclePrices=[];        // current cycle ke live prices (0..40s watch)
let carryPrices=[];        // pichle cycle ke last-20s prices
let capturingCarry=false;  // last 20s me true
let carryMomentum=0;       // system khud nikalta hai: pichle 20s ki direction (-1..+1)
let priceHistory=[];       // graph ke liye
let startPrice=null;       // is cycle ka pehla live price
let lastPrice=null;        // latest live price
let locked=null;           // last 20s me lock hua final signal
let lastCycleId=null;      // cycle reset detect karne ke liye

/* ================= WEBSOCKET ================= */
function connectWS(){
  apiHealth.textContent="CONNECTING";
  apiHealth.style.color="var(--yellow)";
  apiFilter.textContent="CONNECTING…";

  ws=new WebSocket("wss://ws.twelvedata.com/v1/quotes/price?apikey="+TWELVE_KEY);

  ws.onopen=()=>{
    ws.send(JSON.stringify({action:"subscribe",params:{symbols:SYMBOL}}));
    apiHealth.textContent="CONNECTED";
    apiHealth.style.color="var(--green)";
    apiFilter.textContent="LIVE";
  };

  ws.onmessage=(ev)=>{
    let m;
    try{ m=JSON.parse(ev.data); }catch{ return; }

    if(m.event==="price" && m.price!=null){
      const p=parseFloat(m.price);
      if(!isFinite(p)) return;

      lastPrice=p;
      if(startPrice===null) startPrice=p;
      cyclePrices.push(p);

      // last 20s ka data automatically alag buffer me capture
      if(capturingCarry) carryPrices.push(p);

      // live price display
      livePrice.textContent=p.toFixed(5);
      priceTime.textContent=new Date().toTimeString().slice(0,8);

      // graph
      priceHistory.push(p);
      if(priceHistory.length>60) priceHistory.shift();
      drawPriceLine();
    }

    if(m.event==="subscribe-status" && m.status==="error"){
      apiHealth.textContent="SUB ERROR";
      apiHealth.style.color="var(--red)";
    }
  };

  ws.onerror=()=>{
    apiHealth.textContent="WS ERROR";
    apiHealth.style.color="var(--red)";
    apiFilter.textContent="ERROR";
  };

  ws.onclose=()=>{
    apiHealth.textContent="RECONNECTING";
    apiHealth.style.color="var(--yellow)";
    apiFilter.textContent="RETRY…";
    setTimeout(connectWS,3000); // auto reconnect
  };
}
connectWS();

/* ================= PRICE GRAPH ================= */
function drawPriceLine(){
  if(priceHistory.length<2){ priceLine.setAttribute("d",""); return; }
  const min=Math.min(...priceHistory);
  const max=Math.max(...priceHistory);
  const range=(max-min)||1;
  const step=300/(priceHistory.length-1);
  const d="M "+priceHistory.map((p,i)=>{
    const x=(i*step).toFixed(1);
    const y=(110-((p-min)/range)*100).toFixed(1);
    return x+","+y;
  }).join(" L ");
  priceLine.setAttribute("d",d);
  const up = lastPrice!=null && startPrice!=null && lastPrice>=startPrice;
  priceLine.style.stroke = up ? "var(--green)" : "var(--red)";
}

/* ================= CYCLE RESET ================= */
function resetCycle(){
  // --- AUTO MOMENTUM: system khud pichle 20s ki direction nikalta hai ---
  if(carryPrices.length>=2){
    const first=carryPrices[0];
    const last=carryPrices[carryPrices.length-1];
    if(first!==0){
      const mv=((last-first)/first)*100;                  // pichle 20s ka % move
      carryMomentum=Math.max(-1,Math.min(1,mv*900/50));   // -1..+1 me normalize
    }else{
      carryMomentum=0;
    }
  }else{
    carryMomentum=0; // data na ho to neutral
  }

  // naya cycle fresh (live) shuru
  cyclePrices=[];
  carryPrices=[];
  capturingCarry=false;
  startPrice=lastPrice;   // naye minute ka asli move iske base pr

  locked=null;
  signal.textContent="WAIT";
  signal.className="signal skip";
  biasBar.style.width="0%";
  biasText.textContent="--";
  confText.textContent="--%";
  confBar.style.width="0%";
  accCircle.style.setProperty('--deg',"0deg");
  accVal.textContent="--%";
}

/* ================= MAIN ENGINE (1 MIN CYCLE) ================= */
setInterval(()=>{
  const d=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Kolkata"}));
  const sec=d.getSeconds();          // 0..59 = hamara cycle
  const elapsed=sec;                 // 0..59
  const rem=CYCLE-elapsed;           // 60..1
  timer.textContent=rem;

  // naya minute -> sab reset
  const cycleId=Math.floor(Date.now()/60000);
  if(cycleId!==lastCycleId){
    lastCycleId=cycleId;
    resetCycle();
  }

  // ---- live bias REAL prices se ----
  let move=0, liveBias=50;
  if(startPrice!=null && lastPrice!=null && startPrice!==0){
    move=((lastPrice-startPrice)/startPrice)*100;
    liveBias=Math.max(0,Math.min(100,50+move*900));
  }

  // AUTO: pichle 20s ka momentum bias me mila do (live 80%, momentum 20%)
  const momentumBias=50+carryMomentum*50;                 // -1..+1 -> 0..100
  let bias=Math.round(liveBias*0.8 + momentumBias*0.2);
  bias=Math.max(0,Math.min(100,bias));

  const conf=Math.max(0,Math.min(100,Math.round(Math.abs(bias-50)*2)));

  biasBar.style.width=bias+"%";
  biasText.textContent = bias>55?"BULLISH":bias<45?"BEARISH":"SIDEWAYS";
  biasText.style.color = bias>55?"var(--green)":bias<45?"var(--red)":"var(--yellow)";

  confText.textContent=conf+"%";
  confBar.style.width=conf+"%";
  accCircle.style.setProperty('--deg',(conf*3.6)+"deg");
  accVal.textContent=conf+"%";

  // ---- PHASE 1: WATCHING (first 40s) ----
  if(elapsed < WATCH){
    phase.textContent="WATCHING MARKET";
    phase.className="phase watching";
    signal.textContent="WAIT";
    signal.className="signal skip";
  }
  // ---- PHASE 2: FINAL SIGNAL (last 20s) ----
  else{
    phase.textContent="FINAL SIGNAL";
    phase.className="phase locking";

    capturingCarry=true;   // system khud last 20s ka data momentum ke liye jama karta hai

    if(locked===null){
      if(cyclePrices.length<2 || lastPrice==null || startPrice==null){
        locked="SKIP"; // enough live data nahi
      }else{
        locked = bias>55 ? "UP" : bias<45 ? "DOWN" : "SKIP";
      }
    }

    signal.textContent=locked;
    signal.className="signal "+(locked==="UP"?"big":locked==="DOWN"?"small":"skip");
  }
},250); // 4x per second smooth timer
</script>

</body>
</html>
